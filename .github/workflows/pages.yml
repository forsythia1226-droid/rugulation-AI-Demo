name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 인용 검증 계층: 시연 답변의 모든 인용이 조문 원문과 일치해야 배포된다
      - name: Verify demo quotes
        run: node scripts/verify-quotes.js
      # 공개 페이지에 필요한 파일만 배포 (CLAUDE.md, scripts 등은 제외)
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html css js assets _site/
          touch _site/.nojekyll
          # 공개본에는 항상 빈 설정만 들어간다 (API 키는 배포물에 포함하지 않는다)
          echo "window.__ENV={};" > _site/js/env.js
          # 배포마다 CSS·JS 주소에 버전을 붙여 브라우저 캐시(10분)로 옛 화면이 보이지 않게 한다
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 인용 검증 계층: 시연 답변의 모든 인용이 조문 원문과 일치해야 배포된다
      - name: Verify demo quotes
        run: node scripts/verify-quotes.js
      # 공개 페이지에 필요한 파일만 배포 (CLAUDE.md, scripts 등은 제외)
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html css js assets _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
